groups:
  - name: ailab
    rules:
      - alert: ApiHighLatency
        expr: histogram_quantile(0.95, sum(rate(ailab_http_request_duration_seconds_bucket[5m])) by (le)) > 0.12
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: API read p95 above 120 ms
      - alert: ApiErrorRate
        expr: sum(rate(ailab_http_requests_total{status=~"5.."}[5m])) / sum(rate(ailab_http_requests_total[5m])) > 0.01
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: API 5xx error rate above 1%
      - alert: RunQueueBacklog
        expr: ailab_run_queue_depth > 20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Run queue is backing up
      - alert: StaleRuns
        expr: ailab_lease_age_seconds > 900
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: A run lease is older than the TTL
      - alert: BudgetExhausted
        expr: ailab_budget_remaining_microusd <= 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: The lab budget is exhausted
      - alert: DiskPressure
        expr: node_filesystem_avail_bytes < 21474836480
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Less than 20 GB free disk
