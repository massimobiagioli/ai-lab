services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"
  redis:
    ports:
      - "127.0.0.1:6379:6379"
  api:
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ../../crates:/src/crates:ro
  worker:
    volumes:
      - ../../crates:/src/crates:ro
  web:
    volumes:
      - ../../web/src:/usr/share/nginx/html:ro
