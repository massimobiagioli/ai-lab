# Prometheus alert rules (WP-20).
groups:
  - name: ailab-edge
    rules:
      - alert: AilabHighErrorRate
        expr: rate(ailab_http_errors_total[5m]) / rate(ailab_http_requests_total[5m]) > 0.01
        for: 10m
        labels:
          severity: page
        annotations:
          summary: Edge 5xx rate above 1%
      - alert: AilabHighLatency
        expr: histogram_quantile(0.95, rate(ailab_http_request_duration_ms_bucket[5m])) > 300
        for: 10m
        labels:
          severity: page
        annotations:
          summary: Edge p95 latency above 300 ms
      - alert: AilabNoTraffic
        expr: rate(ailab_http_requests_total[10m]) == 0
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: No edge traffic for 15 minutes
