<section class="dashboard" aria-labelledby="dashboard-title">
  <header class="dashboard__header">
    <h2 id="dashboard-title">Flow</h2>
    <app-status-badge label="Flow health" [tone]="health()" />
  </header>
  <dl class="dashboard__grid">
    <div>
      <dt>Lead p50</dt>
      <dd>{{ metrics().leadTimeP50Minutes }} min</dd>
    </div>
    <div>
      <dt>Lead p95</dt>
      <dd>{{ metrics().leadTimeP95Minutes }} min</dd>
    </div>
    <div>
      <dt>Cycle p50</dt>
      <dd>{{ metrics().cycleTimeP50Minutes }} min</dd>
    </div>
    <div>
      <dt>WIP</dt>
      <dd>{{ metrics().wip }}</dd>
    </div>
    <div>
      <dt>Throughput</dt>
      <dd>{{ metrics().throughputWeekly }} / week</dd>
    </div>
    <div>
      <dt>Blocked</dt>
      <dd>{{ (metrics().blockedShare * 100).toFixed(1) }}%</dd>
    </div>
  </dl>
</section>
