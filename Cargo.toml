[workspace]
resolver = "3"
members = [
  "crates/domain",
  "crates/application",
  "crates/infrastructure",
  "crates/llm",
  "crates/scm",
  "crates/memory",
  "crates/orchestrator",
  "crates/api",
  "crates/worker",
  "crates/telemetry",
  "crates/testkit",
  "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/example/ai-lab"
rust-version = "1.99.1"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"

[profile.dev]
opt-level = 0
debug = 1

[profile.dev.package."*"]
opt-level = 1
