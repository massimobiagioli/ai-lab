[package]
name = "ailab-infrastructure"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "AI-Lab infrastructure crate"

[lints]
workspace = true

[dependencies]
ailab-application = { path = "../application" }
ailab-domain = { path = "../domain" }
aes-gcm = "0.10"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v7"] }
subtle = "2.6"

[dev-dependencies]
futures = "0.3"
