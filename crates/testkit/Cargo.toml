[package]
name = "ailab-testkit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "AI-Lab test kit"

[lints]
workspace = true

[dependencies]
ailab-application = { path = "../application" }
ailab-domain = { path = "../domain" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v7"] }

[dev-dependencies]
futures = "0.3"
