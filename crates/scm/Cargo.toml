[package]
name = "ailab-scm"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "AI-Lab SCM port and GitHub adapter"

[lints]
workspace = true

[dependencies]
ailab-application = { path = "../application" }
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"

[dev-dependencies]
futures = "0.3"
