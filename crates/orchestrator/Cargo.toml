[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[package]
name = "ailab-orchestrator"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "AI-Lab orchestrator crate"

[lints]
workspace = true

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ailab-application = { path = "../application" }
ailab-domain = { path = "../domain" }
ailab-infrastructure = { path = "../infrastructure" }
ailab-llm = { path = "../llm" }
ailab-scm = { path = "../scm" }
async-trait = "0.1"
axum = "0.8"
bollard = "0.18"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time"] }
uuid = { version = "1", features = ["v4"] }
cron = "0.15"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }
thiserror = "2"

[[bin]]
name = "ailab-runner"
path = "src/bin/runner.rs"
