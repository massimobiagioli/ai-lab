[package]
name = "ailab-orchestrator"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "AI-Lab orchestrator crate"

[lints]
workspace = true

[dependencies]
ailab-domain = { path = "../domain" }
ailab-infrastructure = { path = "../infrastructure" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[[bin]]
name = "ailab-runner"
path = "src/bin/runner.rs"
